<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arabic Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem('arabic-theme');if(t&&t!=='auto')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  --bg:#f6f3ec; --card:#fffdf8; --ink:#1f2a24; --muted:#6b736d; --line:#e4ddcf;
  --accent:#1f6f54; --accent-soft:#e3f0ea; --m:#2f5d9e; --m-soft:#e6eef9; --f:#a3456b; --f-soft:#f8e8ef;
  --again:#b5482f; --good:#1f6f54; --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(40,30,10,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme]){
  --bg:#141816; --card:#1d2320; --ink:#ecefe9; --muted:#9aa39c; --line:#2d3530;
  --accent:#5fbf98; --accent-soft:#1f3229; --m:#8fb3ea; --m-soft:#1e2a3b; --f:#e79ab9; --f-soft:#3a2230;
  --again:#e7866f; --good:#5fbf98; --shadow:none;}}
:root{--on-accent:#fff}
:root[data-theme=sand]{--bg:#f6f3ec;--card:#fffdf8;--ink:#1f2a24;--muted:#6b736d;--line:#e4ddcf;--accent:#1f6f54;--accent-soft:#e3f0ea;--good:#1f6f54}
:root[data-theme=night]{--bg:#141816;--card:#1d2320;--ink:#ecefe9;--muted:#9aa39c;--line:#2d3530;--accent:#5fbf98;--accent-soft:#1f3229;--m:#8fb3ea;--m-soft:#1e2a3b;--f:#e79ab9;--f-soft:#3a2230;--again:#e7866f;--good:#5fbf98;--shadow:none;--on-accent:#0f1a14}
:root[data-theme=madinah]{--bg:#fbfaf6;--card:#ffffff;--ink:#14281f;--muted:#6a7570;--line:#e7e1cf;--accent:#0b6b4a;--accent-soft:#f3ecd6;--good:#0b6b4a;--gold:#b8892b}
:root[data-theme=madinah] .brand .ar,:root[data-theme=madinah] h1{color:#9a7120}
:root[data-theme=ocean]{--bg:#eef4f9;--card:#ffffff;--ink:#14243a;--muted:#5d6b7c;--line:#d5e1ec;--accent:#1d4e89;--accent-soft:#dde9f6;--good:#1d4e89}
:root[data-theme=desert]{--bg:#f5ebdc;--card:#fffaf2;--ink:#3a2618;--muted:#80695a;--line:#e8d6bf;--accent:#b4532a;--accent-soft:#f6e1d2;--good:#8a6d1f}
:root[data-theme=autumn]{--bg:#24160c;--card:#33200f;--ink:#f6e6c8;--muted:#c9a77c;--line:#553519;--accent:#e08a2c;--accent-soft:#4a2c13;--good:#d9a03a;--again:#e2714a;--m:#9cc0ee;--m-soft:#22324a;--f:#f0a3bf;--f-soft:#4a2433;--on-accent:#24160c;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}
:root[data-theme=autumn] .brand .ar,:root[data-theme=autumn] h1{color:#f0b14a}
:root[data-theme=autumn] body{background:radial-gradient(1100px 480px at 100% -10%,rgba(214,120,30,.28) 0,transparent 60%),radial-gradient(900px 420px at -10% 110%,rgba(170,70,20,.30) 0,transparent 55%),var(--bg);background-attachment:fixed}
:root[data-theme=autumn] header{background:rgba(36,22,12,.9);backdrop-filter:blur(6px)}
:root[data-theme=autumn] .cat .thumb{background-color:#4a2c13}
:root[data-theme=ink]{--bg:#ffffff;--card:#ffffff;--ink:#111111;--muted:#555555;--line:#d8d8d8;--accent:#111111;--accent-soft:#eeeeee;--good:#111111;--shadow:none}
.gear{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;font-size:18px;display:flex;align-items:center;justify-content:center}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:70px 16px}
.modal{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{margin:0 0 4px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.modal h2 button{border:0;background:none;font-size:22px;color:var(--muted)}
.modal h3{font-size:14px;color:var(--muted);margin:18px 0 10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.theme{border:2px solid var(--line);border-radius:12px;padding:0;overflow:hidden;text-align:left;background:none}
.theme.on{border-color:var(--accent)}
.theme .sw{height:52px;display:flex;align-items:center;justify-content:center;gap:6px;font-family:Amiri,serif;font-size:22px}
.theme .sw i{width:16px;height:16px;border-radius:50%;display:inline-block}
.theme .nm{padding:7px 10px;font-size:13px;font-weight:600;background:var(--card)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.ar{font-family:Amiri,"Noto Naskh Arabic","Geeza Pro",serif;direction:rtl;unicode-bidi:isolate}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px;cursor:pointer;margin-right:auto}
.brand .ar{font-size:24px;color:var(--accent);font-weight:700}
nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
nav button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:14px;font-weight:500;color:var(--muted)}
nav button.on{background:var(--accent-soft);color:var(--accent)}
main{max-width:1080px;margin:auto;padding:22px 18px 60px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px;font-size:15px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:120px}
.stat b{display:block;font-size:22px}
.stat span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .12s}
.cat:hover{transform:translateY(-2px)}
.cat.sel{outline:3px solid var(--accent);outline-offset:-3px}
.cat .thumb{height:110px;background:var(--accent-soft) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:40px}
.cat .body{padding:10px 14px 12px}
.cat .name{font-weight:600}
.cat .meta{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;margin-top:2px}
.prog{height:5px;background:var(--line);border-radius:5px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
select,input[type=search]{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 12px}
input[type=search]{min-width:220px;flex:1}
.go{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:9px 18px;font-weight:600}
.go:disabled{opacity:.4;cursor:default}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 14px}
/* study */
.study{max-width:620px;margin:auto}
.topline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;margin-bottom:10px}
.flash{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);min-height:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 26px 34px;text-align:center;cursor:pointer;position:relative;user-select:none}
.flash img{max-width:100%;max-height:220px;border-radius:12px;margin-bottom:16px;object-fit:contain}
.flash .en{font-size:26px;font-weight:600}
.flash .big{font-size:52px;line-height:1.5}
.flash .plural{font-size:26px;color:var(--muted);margin-top:4px}
.plural-l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.flash .tr{color:var(--muted);font-style:italic;margin-top:6px}
.flash .hint{position:absolute;bottom:14px;font-size:13px;color:var(--muted)}
.flash hr{width:60%;border:0;border-top:1px solid var(--line);margin:16px 0}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:999px;padding:3px 11px;margin-top:10px}
.gtag{display:inline-block;vertical-align:middle;font-size:.55em;font-weight:600;border-radius:999px;padding:2px 10px;margin-left:4px}.gtag.m{background:var(--m-soft);color:var(--m)}.gtag.f{background:var(--f-soft);color:var(--f)}
.item .gtag{font-size:11px;padding:1px 7px}
.badge.m{background:var(--m-soft);color:var(--m)} .badge.f{background:var(--f-soft);color:var(--f)}
.badge .ar{font-size:16px;font-weight:400}
.tag{font-size:12px;color:var(--muted);position:absolute;top:14px;left:18px}
.audio{position:absolute;top:10px;right:12px;border:1px solid var(--line);background:var(--bg);border-radius:999px;width:42px;height:42px;font-size:18px}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.rate5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px}
.rate5 button{border:0;border-radius:12px;padding:12px 6px;font-weight:600;color:#fff;font-size:14px;line-height:1.25}
.rate5 button small{display:block;font-weight:400;opacity:.9;font-size:11px;margin-top:3px}
.rate5 .r0{background:#a8322a}.rate5 .r1{background:#d0702c}.rate5 .r2{background:#c9a227;color:#2a2205}.rate5 .r3{background:#4f9a6b}.rate5 .r4{background:#1f6f54}
.under{display:flex;gap:10px;margin-top:12px}
.under .reveal{flex:1;background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;padding:14px;font-weight:600;font-size:16px}
.under .skip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;color:var(--muted)}
.sumgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:560px;margin:18px auto}
.sumgrid div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;font-size:12px;color:var(--muted)}
.sumgrid b{display:block;font-size:22px;color:var(--ink)}
@media (max-width:560px){.rate5{grid-template-columns:repeat(5,1fr);gap:5px}.rate5 button{font-size:12px;padding:10px 3px}.rate5 button small{display:none}}
.rate button{border:0;border-radius:12px;padding:14px;font-weight:600;color:#fff;font-size:16px}
.rate .a{background:var(--again)} .rate .g{background:var(--good)}
.rate button small{display:block;font-weight:400;opacity:.85;font-size:12px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.choices button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:14px;font-weight:600;font-size:16px}
.choices button.right{border-color:var(--good);background:var(--accent-soft)}
.choices button.wrong{border-color:var(--again)}
.done{text-align:center;padding:50px 20px}
.done b{font-size:40px;display:block}
/* browse */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;position:relative}
.item img{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none;background:var(--accent-soft)}
.item .noimg{width:64px;height:64px;border-radius:10px;flex:none;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:22px}
.item .w{min-width:0;flex:1}
.item .e{font-weight:600;font-size:14px}
.item .a{font-size:24px;line-height:1.4}
.item .p{font-size:16px;color:var(--muted)}
.item .badge{margin-top:2px;font-size:11px;padding:1px 8px}
.item .play{border:0;background:none;font-size:18px;padding:4px}
.section-h{font-size:15px;font-weight:600;margin:22px 0 10px;color:var(--muted)}
.empty{color:var(--muted);padding:30px;text-align:center}
.note{font-size:13px;color:var(--muted);margin-top:26px}
kbd{font:12px Inter,sans-serif;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px}
@media (max-width:560px){.flash .big{font-size:42px}.flash{min-height:360px}.bar{gap:8px}nav button{padding:6px 9px}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand" onclick="go('home')"><span class="ar">بِطَاقَات</span> Arabic Flashcards</div>
  <nav id="nav">
    <button data-v="home">Categories</button>
    <button data-v="browse">Browse</button>
  </nav>
  <button class="gear" id="gear" title="Settings" aria-label="Settings">⚙️</button>
</div></header>
<main id="app"></main>
<script src="cards.js"></script>
<script>
const CARDS = window.CARDS;
const ORDER = ["People & Family","Pronouns & Pointing Words","Question Words","School & Classroom","Home & Furniture","Kitchen & Table","Food & Drink","Body","Clothes & Accessories","Colours","Describing Words","Numbers, Ordinals & Clock","Time & Days","Weather & Seasons","Nature & the Outdoors","Animals & Insects","Transport & Cars","Play & Sport","Post & Mail","Travel & Immigration","Office & Business","Prepositions & Particles","Verbs","Verbal Nouns (Maṣdar)","Common Phrases"];
const ICON = {"People & Family":"👪","Pronouns & Pointing Words":"👉","Question Words":"❓","Jobs":"🧑‍⚕️","School & Classroom":"📚","Home & Furniture":"🏠","Kitchen & Table":"🍽️","Food & Drink":"🍞","Body":"✋","Clothes & Accessories":"👕","Colours":"🎨","Describing Words":"⚖️","Numbers, Ordinals & Clock":"🔢","Time & Days":"🕰️","Weather & Seasons":"🌦️","Nature & the Outdoors":"🏞️","Animals & Insects":"🐪","Transport & Cars":"🚗","Play & Sport":"⚽","Post & Mail":"✉️","Travel & Immigration":"🛂","Office & Business":"💼","Prepositions & Particles":"📍","Verbs":"🏃","Verbal Nouns (Maṣdar)":"📝","Doers (Ism Fāʿil)":"🧑‍🏫","Common Phrases":"💬"};
const GROUPS = [["Nouns & topics",ORDER.slice(0,21)],["Grammar words",ORDER.slice(21,24)],["Phrases",ORDER.slice(24)]];
const cats = {}; CARDS.forEach(c=>(cats[c.cat]??=[]).push(c));
// words whose English is shared by a masculine and a feminine card (e.g. "Baby/young child", colours, adjectives, numbers)
const normEn=e=>e.toLowerCase().replace(/\s+/g,' ').trim();
const gPairs=(()=>{const m={};CARDS.forEach(c=>{if(c.g)(m[normEn(c.en)]??=new Set()).add(c.g)});return new Set(Object.keys(m).filter(k=>m[k].size>1));})();
const needsG=c=>c.g&&gPairs.has(normEn(c.en));
const gTag=c=>needsG(c)?`<span class="gtag ${c.g}">${c.g==='m'?'masculine':'feminine'}</span>`:'';

// ---- storage (per device) ----
const KEY='arabic-flash-v1';
let S={box:{},seen:{}}; try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
S.r=S.r||{};
const DAY=864e5, now=()=>Date.now();
const RATINGS=[
  {label:"Didn't know at all", short:"No idea", hint:"again in a moment"},
  {label:"Didn't know", short:"Didn't know", hint:"again soon"},
  {label:"Just got it", short:"Just got it", hint:"again later"},
  {label:"Knew it fairly well", short:"Fairly well", hint:"in a few days"},
  {label:"Knew it very well", short:"Very well", hint:"in a week+"}];
// state per card: ease (how easy), ivl (days until next review), due (timestamp), last (last rating), reps
const st=c=>S.r[c.id];
const known=c=>{const r=st(c); return !!r && r.ivl>=4;};
const isDue=c=>{const r=st(c); return !!r && r.due<=now();};
const weak=c=>{const r=st(c); return !!r && r.last<=1;};
function schedule(c,q){
  const r=S.r[c.id]||{ease:2.5,ivl:0,due:0,last:null,reps:0,lapses:0};
  if(q<=1){ r.ease=Math.max(1.3,r.ease-(q===0?0.25:0.15)); r.ivl=0; r.lapses++; r.due=now()+(q===0?60e3:5*60e3); }
  else if(q===2){ r.ease=Math.max(1.3,r.ease-0.1); r.ivl=r.ivl?Math.max(1,Math.round(r.ivl*1.2)):1; }
  else if(q===3){ r.ivl=r.ivl?Math.round(r.ivl*r.ease):3; }
  else { r.ease=Math.min(3.2,r.ease+0.15); r.ivl=r.ivl?Math.round(r.ivl*r.ease*1.3):7; }
  if(q>=2) r.due=now()+r.ivl*DAY;
  r.last=q; r.reps++; r.seen=now(); S.r[c.id]=r; save();
}
// priority: lower = shown earlier
function priority(c){
  const r=st(c);
  if(!r) return 2;                                  // never seen
  if(r.due<=now()) return r.last<=1?0:1;            // due now, weakest first
  return 3+r.ivl;                                   // not due yet: shortest interval first
}

// ---- state ----
let view='home', selected=new Set(), opts={dir:'en-ar', gender:'all', order:'smart', mode:'flip', tr:true, pf:'all'};
let browseCat='all', q='';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const gBadge=g=>g==='m'?`<span class="badge m">Masculine <span class="ar">مُذَكَّر</span></span>`:g==='f'?`<span class="badge f">Feminine <span class="ar">مُؤَنَّث</span></span>`:'';
let audio=null; function play(src,e){e&&e.stopPropagation(); if(audio)audio.pause(); audio=new Audio(src); audio.play().catch(()=>{});}

function go(v){view=v; document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v||(v==='study'&&b.dataset.v==='home'))); render(); scrollTo(0,0);}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));

function render(){ ({home:renderHome,browse:renderBrowse,study:renderStudy})[view](); }

// ---- home ----
function renderHome(){
  const total=CARDS.length, kn=CARDS.filter(known).length;
  const pool=poolFor([...selected]);
  let h=`<h1>Your flashcards</h1><p class="sub">${total} cards from your AMAU deck, sorted by topic. Pick one or more categories, then start.</p>
  <div class="stats"><div class="stat"><b>${total}</b><span>cards</span></div><div class="stat"><b>${kn}</b><span>known</span></div><div class="stat"><b>${CARDS.filter(isDue).length}</b><span>due for review</span></div><div class="stat"><b>${CARDS.filter(weak).length}</b><span>weak cards</span></div>
  <div class="stat"><b>${CARDS.filter(c=>c.img).length}</b><span>with pictures</span></div><div class="stat"><b>${CARDS.filter(c=>c.aud).length}</b><span>with audio</span></div></div>
  <div class="toolbar">
    <span style="font-weight:600">Show</span>
    ${pill('dir','en-ar','English → Arabic')}${pill('dir','ar-en','Arabic → English')}
    <span style="width:8px"></span>
    ${pill('mode','flip','Flashcards')}${pill('mode','gender','Guess the gender')}
  </div>
  <div class="toolbar">
    ${selected.has('People & Family')?`<span style="font-weight:600">People & Family</span>${pill('pf','all','All')}${pill('pf','people','People & family')}${pill('pf','jobs','Jobs')}${pill('pf','fail','Ism Fāʿil')}</div><div class="toolbar">`:''}
    <span style="font-weight:600">Which cards</span>${pill('order','smart','Smart (weakest & due first)')}${pill('order','due','Only due & weak')}${pill('order','random','Random')}
  </div>
  <div class="toolbar">
    <span style="font-weight:600">Gender</span>${pill('gender','all','All')}${pill('gender','m','Masculine')}${pill('gender','f','Feminine')}
    <span style="width:8px"></span>
    <label><input type="checkbox" id="tr" ${opts.tr?'checked':''}> Show transliteration</label>
    <span style="flex:1"></span>
    <button class="ghost" id="all">${selected.size===ORDER.length?'Clear all':'Select all'}</button>
    <button class="go" id="start" ${pool.length?'':'disabled'}>Start ${pool.length?`(${pool.length})`:''}</button>
  </div>`;
  for(const [gname,list] of GROUPS){
    h+=`<div class="section-h">${gname}</div><div class="grid">`;
    for(const c of list){ const arr=cats[c]||[]; if(!arr.length)continue;
      const k=arr.filter(known).length, img=(arr.find(x=>x.img)||{}).img;
      h+=`<button class="cat ${selected.has(c)?'sel':''}" data-c="${esc(c)}">
        <div class="thumb" style="${img?`background-image:url('${img}')`:''}">${img?'':ICON[c]||'📘'}</div>
        <div class="body"><div class="name">${ICON[c]||''} ${esc(c)}</div>
        <div class="meta"><span>${arr.length} cards</span><span>${k} known</span></div>
        <div class="prog"><i style="width:${arr.length?k/arr.length*100:0}%"></i></div></div></button>`;}
    h+=`</div>`;
  }
  h+=`<p class="note">Your progress is saved in this browser on this device. Cards you rate low come back again in the same session and sooner on later days; cards you know well are spaced further apart. Keys: <kbd>Space</kbd> reveal, <kbd>1</kbd>–<kbd>5</kbd> rate (1 = didn't know at all, 5 = very well), <kbd>S</kbd> skip.</p>`;
  $('#app').innerHTML=h;
  document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{const c=b.dataset.c; selected.has(c)?selected.delete(c):selected.add(c); renderHome();});
  bindPills(renderHome);
  $('#tr').onchange=e=>{opts.tr=e.target.checked};
  $('#all').onclick=()=>{ selected.size===ORDER.length?selected.clear():ORDER.forEach(c=>selected.add(c)); renderHome(); };
  $('#start').onclick=()=>startSession();
}
function pill(k,v,label){return `<button class="pill ${opts[k]===v?'on':''}" data-k="${k}" data-v="${v}">${label}</button>`}
function bindPills(cb){document.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{opts[p.dataset.k]=p.dataset.v; cb();});}
function poolFor(list){
  let p=list.flatMap(c=>cats[c]||[]);
  if(opts.pf!=='all') p=p.filter(c=>c.cat!=='People & Family'||c.sub===opts.pf);
  if(opts.order==='due') p=p.filter(c=>isDue(c)||weak(c));
  if(opts.gender!=='all'||opts.mode==='gender') p=p.filter(c=>opts.gender==='all'?c.g:c.g===opts.gender);
  return p;
}

// ---- study session ----
let sess=null;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function startSession(){
  let pool=shuffle(poolFor([...selected]));
  if(opts.order!=='random') pool.sort((a,b)=>priority(a)-priority(b));
  sess={queue:pool, i:0, flipped:false, again:0, good:0, total:pool.length, answered:null, counts:[0,0,0,0,0], skipped:0, tries:{}};
  go('study');
}
function renderStudy(){
  if(!sess){go('home');return}
  if(sess.i>=sess.queue.length){
    $('#app').innerHTML=`<div class="study"><div class="done"><b>🎉</b><h1>Session complete</h1>
      ${opts.mode==='gender'?`<p class="sub">${sess.good} right · ${sess.again} wrong</p>`:`<div class="sumgrid">${RATINGS.map((r,i)=>`<div><b>${sess.counts[i]}</b>${r.short}</div>`).join('')}</div><p class="sub">${sess.skipped?`${sess.skipped} skipped · `:''}${CARDS.filter(isDue).length} cards due for review overall</p>`}
      <button class="go" onclick="startSession()">Go again</button> <button class="ghost" onclick="go('home')">Back to categories</button></div></div>`;
    return;
  }
  const c=sess.queue[sess.i], isG=opts.mode==='gender';
  const front=isG||opts.dir==='ar-en';
  let face='';
  const img=c.img?`<img src="${c.img}" alt="">`:'';
  const arBlock=`<div class="ar big">${esc(c.ar)}</div>${c.pl?`<div class="plural-l">Plural</div><div class="ar plural">${esc(c.pl)}</div>`:''}${opts.tr&&c.tr?`<div class="tr">${esc(c.tr)}</div>`:''}`;
  const enBlock=`<div class="en">${esc(c.en)} ${gTag(c)}</div>`;
  if(isG){
    face=`${img}<div class="ar big">${esc(c.ar)}</div>${sess.answered?`${c.pl?`<div class="plural-l">Plural</div><div class="ar plural">${esc(c.pl)}</div>`:''}<hr>${enBlock}${gBadge(c.g)}`:`<div class="hint" style="position:static;margin-top:10px">Is this word masculine or feminine?</div>`}`;
  } else if(!sess.flipped){
    face= front? `${img}${arBlock}` : `${img}${enBlock}`;
    face+=`<div class="hint">Tap to flip</div>`;
  } else {
    face= front? `${img}${arBlock}<hr>${enBlock}${gBadge(c.g)}` : `${img}${enBlock}<hr>${arBlock}${gBadge(c.g)}`;
  }
  const showAudio=c.aud&&(sess.flipped||front||isG);
  let h=`<div class="study"><div class="topline"><button class="ghost" onclick="go('home')">← Categories</button><span>${sess.queue.length-sess.i} left</span></div>
    <div class="flash" id="flash"><span class="tag">${esc(c.cat)}${c.lesson&&c.lesson!==c.cat?` · ${esc(c.lesson)}`:''}</span>${showAudio?`<button class="audio" onclick="play('${c.aud}',event)" title="Play audio">🔊</button>`:''}${face}</div>`;
  if(isG){
    h+=`<div class="choices"><button data-g="m" class="${sess.answered?(c.g==='m'?'right':sess.answered==='m'?'wrong':''):''}">Masculine <span class="ar">مُذَكَّر</span></button>
       <button data-g="f" class="${sess.answered?(c.g==='f'?'right':sess.answered==='f'?'wrong':''):''}">Feminine <span class="ar">مُؤَنَّث</span></button></div>
       ${sess.answered?`<div class="rate" style="grid-template-columns:1fr"><button class="g" id="next">Next →</button></div>`:''}`;
  } else if(sess.flipped){
    h+=`<div class="rate5">${RATINGS.map((r,i)=>`<button class="r${i}" data-r="${i}" title="${r.label} (${i+1})">${r.label}<small>${r.hint}</small></button>`).join('')}</div>
        <div class="under"><button class="skip" id="skip">Skip</button></div>`;
  } else {
    h+=`<div class="under"><button class="reveal" id="reveal">Reveal answer</button><button class="skip" id="skip">Skip</button></div>`;
  }
  h+=`</div>`;
  $('#app').innerHTML=h;
  if(!isG) $('#flash').onclick=()=>{sess.flipped=!sess.flipped; renderStudy(); if(sess.flipped&&c.aud&&c.cat==='Common Phrases')play(c.aud);};
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>rate(+b.dataset.r));
  const rv=$('#reveal'); if(rv) rv.onclick=()=>$('#flash').click();
  const sk=$('#skip'); if(sk) sk.onclick=skip;
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ if(sess.answered)return; sess.answered=b.dataset.g; const ok=b.dataset.g===c.g; ok?sess.good++:sess.again++; renderStudy(); });
  const n=$('#next'); if(n) n.onclick=()=>{sess.answered=null; sess.i++; renderStudy();};
}
function rate(q){
  const c=sess.queue[sess.i];
  schedule(c,q); sess.counts[q]++;
  // active recall within the session: the weaker the answer, the sooner it comes back
  const t=(sess.tries[c.id]=(sess.tries[c.id]||0)+1);
  let gap=null;
  if(q===0) gap=2+(Math.random()*2|0);        // 2–3 cards later
  else if(q===1) gap=5+(Math.random()*3|0);   // 5–7 cards later
  else if(q===2 && t===1) gap=12+(Math.random()*5|0); // once more, much later
  if(gap!==null && t<6) sess.queue.splice(Math.min(sess.queue.length, sess.i+1+gap),0,c);
  sess.i++; sess.flipped=false; renderStudy();
}
function skip(){
  const c=sess.queue[sess.i]; sess.skipped++;
  sess.sk=sess.sk||{}; if(!sess.sk[c.id]){ sess.sk[c.id]=1; sess.queue.push(c); }
  sess.i++; sess.flipped=false; renderStudy();
}
document.addEventListener('keydown',e=>{
  if(view!=='study'||!sess||e.target.tagName==='INPUT')return;
  if(opts.mode==='gender'){ if(e.key==='m'||e.key==='1')$('[data-g=m]')?.click(); if(e.key==='f'||e.key==='2')$('[data-g=f]')?.click(); if((e.key==='Enter'||e.key===' ')&&$('#next')){e.preventDefault();$('#next').click()} return;}
  if(e.key===' '){e.preventDefault(); $('#flash')?.click();}
  if(sess.flipped&&/^[1-5]$/.test(e.key))rate(+e.key-1);
  if(e.key==='s'||e.key==='S')skip();
});

// ---- browse ----
function renderBrowse(){
  let h=`<h1>Browse</h1><p class="sub">Search any word in English or Arabic.</p>
  <div class="toolbar"><input type="search" id="q" placeholder="Search…" value="${esc(q)}">
  <select id="bc"><option value="all">All categories</option>${ORDER.filter(c=>cats[c]).map(c=>`<option ${browseCat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
  ${pill('gender','all','All')}${pill('gender','m','Masculine')}${pill('gender','f','Feminine')}</div>
  ${browseCat==='People & Family'?`<div class="toolbar">${pill('pf','all','All')}${pill('pf','people','People & family')}${pill('pf','jobs','Jobs')}${pill('pf','fail','Ism Fāʿil')}</div>`:''}<div id="res"></div>`;
  $('#app').innerHTML=h;
  $('#q').oninput=e=>{q=e.target.value; list();};
  $('#bc').onchange=e=>{browseCat=e.target.value; renderBrowse();};
  bindPills(()=>{renderBrowse(); $('#q').focus();});
  list();
}
const strip=s=>(s||'').replace(/[ً-ٰٟـ]/g,'').toLowerCase();
function list(){
  const t=strip(q.trim());
  let r=CARDS.filter(c=>(browseCat==='all'||c.cat===browseCat)&&(opts.gender==='all'||c.g===opts.gender)&&(browseCat!=='People & Family'||opts.pf==='all'||c.sub===opts.pf)&&(!t||strip(c.en+' '+c.ar+' '+c.pl+' '+c.tr).includes(t)));
  const shown=r.slice(0,300);
  $('#res').innerHTML= r.length? `<p class="sub">${r.length} card${r.length===1?'':'s'}${r.length>300?' (showing first 300)':''}</p><div class="list">`+shown.map(c=>`
    <div class="item">${c.img?`<img loading="lazy" src="${c.img}" alt="">`:`<div class="noimg">${ICON[c.cat]||'📘'}</div>`}
    <div class="w"><div class="e">${esc(c.en)} ${gTag(c)}</div><div class="ar a">${esc(c.ar)}</div>${c.pl?`<div class="ar p">${esc(c.pl)}</div>`:''}${gBadge(c.g)}</div>
    ${c.aud?`<button class="play" onclick="play('${c.aud}',event)">🔊</button>`:''}</div>`).join('')+`</div>` : `<div class="empty">No cards match.</div>`;
}

// ---- settings ----
const THEMES=[
 ['auto','Auto (match device)',['#f6f3ec','#1f6f54','#141816']],
 ['sand','Sand & Green',['#f6f3ec','#fffdf8','#1f6f54']],
 ['night','Night',['#141816','#1d2320','#5fbf98']],
 ['madinah','Madinah',['#fbfaf6','#0b6b4a','#b8892b']],
 ['ocean','Ocean',['#eef4f9','#ffffff','#1d4e89']],
 ['desert','Desert',['#f5ebdc','#fffaf2','#b4532a']],
 ['autumn','Autumn Leaves',['#24160c','#e08a2c','#f0b14a']],
 ['ink','Ink & Paper',['#ffffff','#eeeeee','#111111']]];
const getTheme=()=>{try{return localStorage.getItem('arabic-theme')||'auto'}catch(e){return 'auto'}};
function setTheme(t){ if(t==='auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme=t; try{localStorage.setItem('arabic-theme',t)}catch(e){} openSettings(); }
function openSettings(){
  document.querySelector('.modal-bg')?.remove();
  const cur=getTheme(), bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal"><h2>Settings <button id="closeS" aria-label="Close">×</button></h2>
    <h3>Colour theme</h3><div class="themes">${THEMES.map(([id,name,[a,b,c]])=>`<button class="theme ${cur===id?'on':''}" data-t="${id}">
      <div class="sw" style="background:${a};color:${c}"><i style="background:${b};border:1px solid rgba(0,0,0,.1)"></i><i style="background:${c}"></i><span>${id==='autumn'?'🍂':'ع'}</span></div><div class="nm">${name}</div></button>`).join('')}</div>
    <h3>Flashcards</h3><label><input type="checkbox" id="trS" ${opts.tr?'checked':''}> Show transliteration</label>
    <p class="note" style="margin-top:16px">Settings are saved on this device.</p></div>`;
  document.body.appendChild(bg);
  bg.onclick=e=>{if(e.target===bg)bg.remove()};
  bg.querySelector('#closeS').onclick=()=>bg.remove();
  bg.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>setTheme(b.dataset.t));
  bg.querySelector('#trS').onchange=e=>{opts.tr=e.target.checked; render();};
}
$('#gear').onclick=openSettings;
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('.modal-bg')?.remove()});

go('home');
</script>
